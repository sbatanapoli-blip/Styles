<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg: #05060a;
    --surface: #0c0e14;
    --accent: #f59e0b;
    --text: #f9fafb;
    --border: #1f2937;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 10px;
    min-height: 100vh;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    padding: 4px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
  }
  .card-media {
    aspect-ratio: 16/9.5;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    padding: 6px;
  }
  .card-content {
    padding: 8px 14px 16px;
    text-align: center;
  }
  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
  }
  .card-meta {
    font-size: 0.65rem;
    color: var(--accent);
    margin-top: 4px;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    z-index: 10000;
    animation: fadeInOut 2.5s forwards;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    10% { opacity: 1; transform: translateX(-50%) translateY(0); }
    90% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }
  .error-msg {
    text-align: center;
    padding: 50px;
    color: #ff6b6b;
  }
</style>
</head>
<body>

<div class="grid" id="channels">
  <div class="error-msg"><i class="fas fa-spinner fa-spin"></i> جاري تحميل القنوات...</div>
</div>

<script>

const API = "https://beinfhd.winsnapoli.workers.dev";
const API_KEY = "wins1937@$";

function showMsg(txt) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<i class="fas fa-info-circle"></i> ${txt}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function encryptURL(url) {
  return btoa(encodeURIComponent(url));
}

function decryptURL(enc) {
  return decodeURIComponent(atob(enc));
}

function buildIntent(enc) {
  const url = decryptURL(enc);
  return "intent://play?url=" + encodeURIComponent(url)
    + "&title=" + encodeURIComponent("Live Stream")
    + "#Intent;scheme=vexo;package=com.vexo.player;end";
}

async function loadChannels() {
  const grid = document.getElementById("channels");
  
  // محاولة 1: POST method (أكثر توافقاً)
  try {
    console.log("محاولة POST...");
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY
      },
      body: JSON.stringify({ request: "channels" })
    });
    
    if (res.ok) {
      const data = await res.json();
      renderChannels(data, grid);
      return;
    }
  } catch(e) {
    console.log("POST فشل:", e);
  }
  
  // محاولة 2: GET مع header
  try {
    console.log("محاولة GET مع header...");
    const res = await fetch(API, {
      method: "GET",
      headers: {
        "x-api-key": API_KEY
      }
    });
    
    if (res.ok) {
      const data = await res.json();
      renderChannels(data, grid);
      return;
    }
  } catch(e) {
    console.log("GET مع header فشل:", e);
  }
  
  // محاولة 3: GET مع token في الـ URL
  try {
    console.log("محاولة GET مع token في URL...");
    const res = await fetch(`${API}?token=${encodeURIComponent(API_KEY)}`);
    
    if (res.ok) {
      const data = await res.json();
      renderChannels(data, grid);
      return;
    }
  } catch(e) {
    console.log("GET مع token فشل:", e);
  }
  
  // كل المحاولات فشلت
  grid.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> فشل تحميل القنوات<br><small>تأكد من اتصال الإنترنت وحاول مرة أخرى</small></div>';
  showMsg("❌ فشل الاتصال بالخادم");
}

function renderChannels(data, grid) {
  if (!data || !data.channels) {
    grid.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> بيانات غير صالحة من الخادم</div>';
    return;
  }
  
  const baseURL = data.baseURL || "";
  const channels = data.channels;
  
  if (!channels || channels.length === 0) {
    grid.innerHTML = '<div class="error-msg"><i class="fas fa-info-circle"></i> لا توجد قنوات متاحة حالياً</div>';
    return;
  }
  
  grid.innerHTML = "";
  
  channels.forEach(c => {
    let url = "";
    if (c.id) url = baseURL + c.id;
    if (c.url) url = c.url;
    
    const card = document.createElement("div");
    card.className = "card";
    
    card.innerHTML = `
      <div class="card-media">
        <img src="${c.logo}" alt="${c.name}" loading="lazy">
      </div>
      <div class="card-content">
        <div class="card-title">${c.name}</div>
        <div class="card-meta"><i class="fas fa-play-circle"></i> Watch Now</div>
      </div>
    `;
    
    card.onclick = () => {
      if (url) {
        window.location.href = buildIntent(encryptURL(url));
      } else {
        showMsg("⚠️ رابط البث غير متوفر حالياً");
      }
    };
    
    grid.appendChild(card);
  });
  
  showMsg(`✅ تم تحميل ${channels.length} قناة`);
}

// بدء التحميل
loadChannels();

</script>

</body>
</html>
