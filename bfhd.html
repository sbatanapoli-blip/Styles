<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  /* ===== PRO CARDS STYLE ===== */
  :root {
    --bg: #05060a;
    --surface: #0c0e14;
    --surface-hover: #141720;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --text: #f9fafb;
    --border: #1f2937;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    padding: 10px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 20% 0%, rgba(245,158,11,0.08) 0%, transparent 35%);
    opacity: 0.6;
  }

  /* ===== CARDS GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    padding: 4px 0;
  }

  @media (min-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }
  }

  /* ===== CARD DESIGN ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s;
    text-decoration: none;
    display: block;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    border-color: var(--accent);
  }

  .card:active {
    transform: translateY(-1px) scale(0.995);
  }

  /* ===== CARD MEDIA ===== */
  .card-media {
    position: relative;
    aspect-ratio: 16/9.5;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    padding: 6px;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .card:hover .card-media img {
    transform: scale(1.07);
  }

  /* ===== CARD CONTENT ===== */
  .card-content {
    padding: 8px 14px 16px;
    position: relative;
    z-index: 2;
    margin-top: -12px;
    transform: translateY(8px);
  }

  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.25;
    color: #fff;
    text-align: center;
    letter-spacing: 0.2px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.65rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
  }

  /* ===== تأثير خلفي للبطاقة ===== */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 35%, rgba(5,6,10,0.8) 85%, var(--surface) 100%);
    pointer-events: none;
    z-index: 1;
    border-radius: var(--radius);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-weight: 700;
    z-index: 10000;
    opacity: 0;
    animation: toastIn 0.3s forwards;
    max-width: 85%;
    text-align: center;
  }

  @keyframes toastIn {
    to {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div class="grid" id="channels"></div>

<script>

const API = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://beinfhd.winsnapoli.workers.dev");
const API_KEY = "wins1937@$";

function encryptURL(url) {
  return btoa(encodeURIComponent(url))
}

function decryptURL(enc) {
  return decodeURIComponent(atob(enc))
}

function buildIntent(enc) {
  const url = decryptURL(enc);
  return "intent://play?url=" + encodeURIComponent(url)
    + "&title=" + encodeURIComponent("Live Stream")
    + "#Intent;scheme=vexo;package=com.vexo.player;end";
}

function showMsg(txt) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<i class="fas fa-info-circle"></i> ${txt}`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 300);
  }, 2500);
}

async function loadChannels() {
  try {
    const res = await fetch(API, {
  headers: {
    "x-api-key": API_KEY
  }
});
    const data = await res.json();
    const baseURL = data.baseURL;
const channels = data.channels;
    const grid = document.getElementById("channels");
    grid.innerHTML = "";

    channels.forEach(c => {
      let url = "";
      if (c.id) url = baseURL + c.id;
      if (c.url) url = c.url;

      // إنشاء البطاقة بالتصميم الاحترافي
      const card = document.createElement("div");
      card.className = "card";

      // قسم الصورة
      const mediaDiv = document.createElement("div");
      mediaDiv.className = "card-media";
      const img = document.createElement("img");
      img.src = c.logo;
      img.alt = c.name;
      img.loading = "lazy";
      mediaDiv.appendChild(img);

      // قسم المحتوى
      const contentDiv = document.createElement("div");
      contentDiv.className = "card-content";
      const title = document.createElement("div");
      title.className = "card-title";
      title.innerText = c.name;
      const meta = document.createElement("div");
      meta.className = "card-meta";
      meta.innerHTML = '<i class="fas fa-play-circle"></i> Watch Now';
      contentDiv.appendChild(title);
      contentDiv.appendChild(meta);

      card.appendChild(mediaDiv);
      card.appendChild(contentDiv);

      card.onclick = () => {
        window.location.href = buildIntent(encryptURL(url));
      };

      grid.appendChild(card);
    });

  } catch(e) {
    console.error(e);
    document.getElementById("channels").innerHTML = '<div style="text-align:center;padding:50px;">❌ Error loading channels</div>';
    showMsg("❌ Failed to load channels");
  }
}

loadChannels();

</script>

</body>
</html>
