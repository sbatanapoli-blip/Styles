<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  :root {
    --bg: #05060a;
    --surface: #0c0e14;
    --accent: #f59e0b;
    --text: #f9fafb;
    --border: #1f2937;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 10px;
    min-height: 100vh;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    padding: 4px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
  }
  .card-media {
    aspect-ratio: 16/9.5;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    padding: 6px;
  }
  .card-content {
    padding: 8px 14px 16px;
    text-align: center;
  }
  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
  }
  .card-meta {
    font-size: 0.65rem;
    color: var(--accent);
    margin-top: 4px;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    z-index: 10000;
    animation: fadeInOut 2.5s forwards;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    10% { opacity: 1; transform: translateX(-50%) translateY(0); }
    90% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }
  .loading-state, .error-state {
    text-align: center;
    padding: 50px;
    color: #888;
  }
  .error-state { color: #ff6b6b; }
</style>
</head>
<body>

<div class="grid" id="channels">
  <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> جاري تحميل القنوات...</div>
</div>

<script>
const API = "https://beinfhd.winsnapoli.workers.dev";
const API_KEY = "wins1937@$";

function showMsg(txt) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<i class="fas fa-info-circle"></i> ${txt}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function encryptURL(url) {
  return btoa(encodeURIComponent(url));
}

function decryptURL(enc) {
  return decodeURIComponent(atob(enc));
}

function buildIntent(enc) {
  const url = decryptURL(enc);
  return "intent://play?url=" + encodeURIComponent(url)
    + "&title=" + encodeURIComponent("Live Stream")
    + "#Intent;scheme=vexo;package=com.vexo.player;end";
}

// بيانات تجريبية (fallback) في حالة فشل الاتصال بالـ Worker
const FALLBACK_CHANNELS = {
  baseURL: "https://example.com/",
  channels: [
    { id: "1", name: "beIN SPORTS 1", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" },
    { id: "2", name: "beIN SPORTS 2", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" },
    { id: "3", name: "beIN SPORTS 3", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" },
    { id: "4", name: "beIN SPORTS 4", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" },
    { id: "5", name: "beIN SPORTS 5", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" },
    { id: "6", name: "beIN SPORTS 6", logo: "https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png", url: "https://beout5-i.akamaihd.net/hls/live/1010630/beout5/playlist.m3u8" }
  ]
};

function renderChannels(data, grid) {
  const baseURL = data.baseURL || "";
  const channels = data.channels;
  
  if (!channels || channels.length === 0) {
    grid.innerHTML = '<div class="error-state"><i class="fas fa-exclamation-triangle"></i> لا توجد قنوات متاحة</div>';
    return;
  }
  
  grid.innerHTML = "";
  
  channels.forEach(c => {
    let url = c.url || "";
    if (!url && c.id) url = baseURL + c.id;
    
    const card = document.createElement("div");
    card.className = "card";
    
    card.innerHTML = `
      <div class="card-media">
        <img src="${c.logo}" alt="${c.name}" loading="lazy" onerror="this.src='https://i.postimg.cc/CxK3Fkz8/Bein_sport_logo.png'">
      </div>
      <div class="card-content">
        <div class="card-title">${c.name}</div>
        <div class="card-meta"><i class="fas fa-play-circle"></i> Watch Now</div>
      </div>
    `;
    
    card.onclick = () => {
      if (url) {
        window.location.href = buildIntent(encryptURL(url));
      } else {
        showMsg("⚠️ رابط البث غير متوفر حالياً");
      }
    };
    
    grid.appendChild(card);
  });
  
  showMsg(`✅ تم تحميل ${channels.length} قناة`);
}

async function loadChannels() {
  const grid = document.getElementById("channels");
  
  // محاولة الاتصال بالـ Worker مع timeout
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 5000);
  
  try {
    console.log("محاولة الاتصال بـ Worker...");
    const res = await fetch(API, {
      method: "GET",
      headers: { "x-api-key": API_KEY },
      signal: controller.signal,
      mode: "cors"
    });
    
    clearTimeout(timeoutId);
    
    if (res.ok) {
      const data = await res.json();
      console.log("تم استلام البيانات من Worker:", data);
      renderChannels(data, grid);
      return;
    } else {
      console.log("Worker رد بـ status:", res.status);
      throw new Error(`HTTP ${res.status}`);
    }
  } catch(e) {
    clearTimeout(timeoutId);
    console.log("فشل الاتصال بالـ Worker، استخدام البيانات المحلية:", e.message);
    
    // استخدام البيانات التجريبية (fallback)
    renderChannels(FALLBACK_CHANNELS, grid);
    showMsg("⚠️ جاري استخدام البث التجريبي - تأكد من اتصالك بالإنترنت");
  }
}

// بدء التحميل
loadChannels();
</script>

</body>
</html>
