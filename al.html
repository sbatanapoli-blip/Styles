<style>
  /* ===== PRO CARDS STYLE ===== */
  :root {
    --bg: #05060a;
    --surface: #0c0e14;
    --surface-hover: #141720;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --text: #f9fafb;
    --border: #1f2937;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    padding: 10px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 20% 0%, rgba(245,158,11,0.08) 0%, transparent 35%);
    opacity: 0.6;
  }

  /* ===== CARDS GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    padding: 4px 0;
  }

  @media (min-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }
  }

  /* ===== CARD DESIGN ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s;
    text-decoration: none;
    display: block;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    border-color: var(--accent);
  }

  .card:active {
    transform: translateY(-1px) scale(0.995);
  }

  /* ===== CARD MEDIA ===== */
  .card-media {
    position: relative;
    aspect-ratio: 16/9.5;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    padding: 6px;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .card:hover .card-media img {
    transform: scale(1.07);
  }

  /* ===== CARD CONTENT ===== */
  .card-content {
    padding: 8px 14px 16px;
    position: relative;
    z-index: 2;
    margin-top: -12px;
    transform: translateY(8px);
  }

  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.25;
    color: #fff;
    text-align: center;
    letter-spacing: 0.2px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.65rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
  }

  /* ===== تأثير خلفي للبطاقة ===== */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 35%, rgba(5,6,10,0.8) 85%, var(--surface) 100%);
    pointer-events: none;
    z-index: 1;
    border-radius: var(--radius);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-weight: 700;
    z-index: 10000;
    opacity: 0;
    animation: toastIn 0.3s forwards;
    max-width: 85%;
    text-align: center;
  }

  @keyframes toastIn {
    to {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  }
</style>
</head>
