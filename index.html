    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg); color: var(--text);

    body::before {

                  linear-gradient(180deg, transparent 60%, rgba(5,6,10,0.9) 100%),
                  repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 40px);
      opacity: 0.6;

    /* ===== HERO SLIDER ===== */
    .hero { 
      position: relative;

      border-radius: 16px; 
      margin-bottom: 20px; 
      background: #000; 
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s var(--ease); }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; animation: slowPan 24s ease-in-out infinite alternate; }

    .hero-desc {

      bottom: 12px;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      font-size: 0.7rem;
      text-align: center;
      color: #f59e0b;
      z-index: 10;
      font-weight: 500;
    }  
  .hero-badge { display: inline-block; padding: 5px 12px; background: var(--accent); color: #000; font-weight: 800; font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%); margin-bottom: 10px; }

    .card {

      border-radius: var(--radius);
