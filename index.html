    { id: 0, img: "https://i.postimg.cc/fyfGLTkm/pngtree-waving-kuwait-flag-background-picture-image-1917207.png", name: "Kuwait", href: "go:0", group: "COUNTRIES" },
    { id: 20, img: "https://i.postimg.cc/wTQd0Fqy/Iraq.jpg", name: "Iraq", href: "go:20", group: "COUNTRIES" },
    
    // ISLAM
    { id: 27, img: "https://i.postimg.cc/tJnC8HmJ/primevideo-seo-logo.png", name: "France", href: "go:27", group: "ISLAM" },
    { id: 28, img: "https://i.postimg.cc/tJnC8HmJ/primevideo-seo-logo.png", name: "France 3", href: "go:28", group: "ISLAM" },
    
    // KIDS
    { id: 4, img: "https://i.postimg.cc/N0K33BcT/galil-tv-logo-red.png", name: "Developer Panel", href: "go:04", group: "KIDS" }
  ];

  // Premium unlock states for VIP items
  let premiumState = {
    netflix: { unlocked: false, expiry: null },
    spotify: { unlocked: false, expiry: null },
    amazon: { unlocked: false, expiry: null },
    boxoffice: { unlocked: false, expiry: null }
  };

  let currentPremiumKey = null;
  let countdownInterval = null;

  function formatTimeLeft(ms) {
    if (ms <= 0) return "00:00";
    let mins = Math.floor(ms / 60000);
    let secs = Math.floor((ms % 60000) / 1000);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function savePremiumState() {
    let toStore = {};
    for (let k in premiumState) {
      toStore[k] = { unlocked: premiumState[k].unlocked, expiry: premiumState[k].expiry };
    }
    localStorage.setItem("galil_vip_rewards", JSON.stringify(toStore));
  }

  function loadPremiumState() {
    let saved = localStorage.getItem("galil_vip_rewards");
    if (!saved) return;
    try {
      let parsed = JSON.parse(saved);
      for (let k in premiumState) {
        if (parsed[k]) {
          if (parsed[k].unlocked && parsed[k].expiry && parsed[k].expiry > Date.now()) {
            premiumState[k] = { unlocked: true, expiry: parsed[k].expiry };
          } else {
            premiumState[k] = { unlocked: false, expiry: null };
          }
        }
      }
    } catch(e) {}
  }

  function unlockPremiumCategory(key, durationMinutes = 15) {
    let expiryTime = Date.now() + (durationMinutes * 60 * 1000);
    if (premiumState[key]) {
      premiumState[key].unlocked = true;
      premiumState[key].expiry = expiryTime;
    }
    savePremiumState();
    updateAllPremiumCardsUI();
    startGlobalTimer();
    showMsg(`✨ ${getPremiumName(key)} unlocked for ${durationMinutes} minutes! ✨`);
  }

  function getPremiumName(key) {
    const names = { netflix: "Netflix", spotify: "Spotify", amazon: "Amazon Prime", boxoffice: "BoxOffice" };
    return names[key] || key;
  }

  function updateAllPremiumCardsUI() {
    const allCards = document.querySelectorAll('.card[data-premium]');
    allCards.forEach(card => {
      let key = card.getAttribute('data-premium-key');
      let state = premiumState[key];
      let existingTimer = card.querySelector('.premium-timer');
      
      if (state && state.unlocked && state.expiry && state.expiry > Date.now()) {
        let remaining = state.expiry - Date.now();
        if (existingTimer) {
          existingTimer.innerHTML = `<i class=""></i> ${formatTimeLeft(remaining)}`;
        } else {
          let timerDiv = document.createElement('div');
          timerDiv.className = 'premium-timer';
          timerDiv.innerHTML = `<i class="fas fa-hourglass-half"></i> ${formatTimeLeft(remaining)}`;
          card.appendChild(timerDiv);
        }
        card.style.opacity = "1";
      } 
      else if (state && state.unlocked && state.expiry && state.expiry <= Date.now()) {
        state.unlocked = false;
        state.expiry = null;
        savePremiumState();
        if (existingTimer) existingTimer.remove();
        showMsg(`⏰ ${getPremiumName(key)} time expired, watch ad again`);
      }
      else {
        if (existingTimer) existingTimer.remove();
        card.style.opacity = "1";
      }
    });
  }

  function startGlobalTimer() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      let anyChange = false;
      for (let k in premiumState) {
        let s = premiumState[k];
        if (s.unlocked && s.expiry && s.expiry <= Date.now()) {
          s.unlocked = false;
          s.expiry = null;
          anyChange = true;
        }
      }
      if (anyChange) {
        savePremiumState();
        updateAllPremiumCardsUI();
      } else {
        updateAllPremiumCardsUI();
      }
    }, 1000);
  }

  // Modal functions
  function showPremiumModal(categoryKey, categoryName) {
    currentPremiumKey = categoryKey;
    const modal = document.getElementById('premiumModal');
    const titleEl = document.getElementById('modalTitle');
    const premiumNameSpan = document.getElementById('premiumName');
    if (titleEl) titleEl.innerHTML = `${categoryName} VIP`;
    if (premiumNameSpan) premiumNameSpan.innerText = categoryName;
    modal.classList.add('active');
  }

  function closeModal() {
    const modal = document.getElementById('premiumModal');
    modal.classList.remove('active');
    currentPremiumKey = null;
  }

  function simulateWatchAd() {
  // ✅ احفظ المفتاح في متغير محلي قبل أي شيء
  const keyToUnlock = currentPremiumKey;
  
  if (!keyToUnlock) return;
  
  const btn = document.getElementById('watchAdBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Watching ad...';
  btn.disabled = true;
  
  setTimeout(() => {
    // 1. فتح القفل
    unlockPremiumCategory(keyToUnlock, 15);
    
    // 2. إغلاق النافذة (هذا سيمسح currentPremiumKey لكن لدينا keyToUnlock)
    closeModal();
    
    // 3. إعادة الزر
    btn.innerHTML = originalText;
    btn.disabled = false;
    
    // 4. رسالة النجاح - استخدم keyToUnlock بدلاً من currentPremiumKey
    const categoryName = getPremiumName(keyToUnlock);
    showMsg(`✅ ${categoryName} unlocked! Opening now...`);
    
    // 5. الفتح التلقائي - استخدم keyToUnlock
    setTimeout(() => {
      const targetCard = cardsData.find(c => c.premiumKey === keyToUnlock);
      if (targetCard && targetCard.href) {
        window.location.href = targetCard.href;
      }
    }, 800);
    
  }, 3000);
}

  // ============================================
  // 🎠 SLIDER
  // ============================================
  const slides = document.querySelectorAll(".slide");
  const dotsContainer = document.getElementById("dots");
  let slideIndex = 0;

  slides.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === 0 ? " active" : "");
    d.onclick = () => showSlide(i);
    dotsContainer.appendChild(d);
  });

  const dots = document.querySelectorAll(".dot");

  function showSlide(i) {
    slides[slideIndex]?.classList.remove("active");
    dots[slideIndex]?.classList.remove("active");
    slideIndex = i;
    slides[slideIndex]?.classList.add("active");
    dots[slideIndex]?.classList.add("active");
  }

  setInterval(() => { showSlide((slideIndex + 1) % slides.length); }, 5000);

  // ============================================
  // 🃏 RENDER CARDS WITH GROUPS (VIP included)
  // ============================================
  function renderCards() {
    const grid = document.getElementById("cardsGrid");
    if (!grid) return;
    grid.innerHTML = "";
    
    const groupOrder = ["SPORTS", "ENTERTAINMENT", "VIP", "COUNTRIES", "EUROPE", "ISLAM", "KIDS"];
    const groupIcons = {
      "SPORTS": "fas fa-layer-group",
      "ENTERTAINMENT": "fas fa-layer-group",
      "VIP": "fas fa-crown",
      "COUNTRIES": "fas fa-layer-group",
      "EUROPE": "fas fa-layer-group",
      "ISLAM": "fa-mosque",
      "KIDS": "fas fa-layer-group"
    };
    
    const groupedCards = {};
    cardsData.forEach(card => {
      let group = card.group;
      if (!groupedCards[group]) groupedCards[group] = [];
      groupedCards[group].push(card);
    });
    
    groupOrder.forEach(groupName => {
      const cardsInGroup = groupedCards[groupName];
      if (cardsInGroup && cardsInGroup.length > 0) {
        const groupHeader = document.createElement("div");
        groupHeader.className = "group-header";
        let displayName = groupName === "VIP" ? "VIP" : groupName;
        let vipClass = groupName === "VIP" ? "vip-badge" : "";
        groupHeader.innerHTML = `
          <div class="group-badge ${vipClass}">
            <i class="fas ${groupIcons[groupName] || 'fa-tag'}"></i>
            ${displayName}
          </div>
        `;
        grid.appendChild(groupHeader);
        
        cardsInGroup.forEach(card => {
          const cardDiv = document.createElement("div");
          cardDiv.className = "card";
          
          if (card.isPremium) {
            cardDiv.setAttribute('data-premium', 'true');
            cardDiv.setAttribute('data-premium-key', card.premiumKey);
          }
          
          cardDiv.onclick = () => { 
  if (card.isPremium) {
    let key = card.premiumKey;
    let state = premiumState[key];
    if (state && state.unlocked && state.expiry && state.expiry > Date.now()) {
      let remaining = Math.floor((state.expiry - Date.now()) / 60000);
      showMsg(`🎬 Opening ${card.name}... (${remaining} min)`);
      window.location.href = card.href;  // ✅ يفتح مباشرة
    } else {
      showPremiumModal(key, card.name);
    }
  } else {
    if (card.href) {
      window.location.href = card.href;  // ✅ يفتح مباشرة
    } else {
      showMsg(`🔜 ${card.name} - Coming Soon`);
    }
  }
};
          
          const mediaDiv = document.createElement("div");
          mediaDiv.className = "card-media";
          const img = document.createElement("img");
          img.src = card.img;
          img.alt = card.name;
          img.loading = "lazy";
          mediaDiv.appendChild(img);
          
          const contentDiv = document.createElement("div");
          contentDiv.className = "card-content";
          const title = document.createElement("div");
          title.className = "card-title";
          if (card.isPremium) {
            title.innerText = card.name + ' 👑';
          } else {
            title.innerText = card.name;
          }
          const meta = document.createElement("div");
          meta.className = "card-meta";
          if (card.isPremium) {
            meta.innerHTML = '<i class="fas fa-crown"></i> Premium';
          } else {
            meta.innerHTML = '<i class="fas fa-play-circle"></i> Watch Now';
          }
          contentDiv.appendChild(title);
          contentDiv.appendChild(meta);
          
          cardDiv.appendChild(mediaDiv);
          cardDiv.appendChild(contentDiv);
          grid.appendChild(cardDiv);
        });
      }
    });
    
    updateAllPremiumCardsUI();
  }

  // ============================================
  // 🍞 TOAST MESSAGE
  // ============================================
  window.showMsg = function(txt) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<i class="fas fa-info-circle"></i> ${txt}`;
    document.body.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 300);
    }, 2500);
  };

  // ============================================
  // 📱 SIDEBAR
  // ============================================
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  
  window.openSidebar = function(content) {
    sidebar.innerHTML = `<h3><i class="fas fa-info-circle"></i> Info</h3>` + 
      (content ? `<div class="sidebar-item">${content}</div>` : `<div class="sidebar-item">Developer Panel</div><div class="sidebar-item">Version: 2.0</div><div class="sidebar-item">Contact: @galiltv04</div>`);
    sidebar.classList.add("open");
    overlay.classList.add("show");
  };
  
  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  }
  
  overlay.onclick = closeSidebar;
  window.goBack = function() { if (window.history.length > 1) window.history.back(); else showMsg("🏠 Home"); };
  
  // ============================================
  // 🚀 INITIALIZATION
  // ============================================
  document.addEventListener("DOMContentLoaded", () => {
    loadPremiumState();
    renderCards();
    startGlobalTimer();
    
    const watchBtn = document.getElementById('watchAdBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('premiumModal');
    watchBtn.addEventListener('click', simulateWatchAd);
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  });
</script>

</body>
