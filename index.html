  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* 🎙️ PRO BROADCAST UI */
    :root {
      --bg: #05060a;
      --surface: #0c0e14;
      --surface-hover: #141720;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text: #f9fafb;
      --text-muted: #6b7280;
      --border: #1f2937;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --radius: 8px;
      --spacing: clamp(12px, 2vw, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.4; padding: var(--spacing); min-height: 100vh;
      position: relative; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 20% 0%, rgba(245,158,11,0.08) 0%, transparent 35%),
                  linear-gradient(180deg, transparent 60%, rgba(5,6,10,0.9) 100%),
                  repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 40px);
      opacity: 0.6;
    }

    /* ===== HERO SLIDER ===== */
    .hero { 
      position: relative; 
      height: clamp(180px, 38vw, 240px); 
      overflow: hidden; 
      border-left: 4px solid var(--accent); 
      border-radius: 16px; 
      margin-bottom: 20px; 
      background: #000; 
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s var(--ease); }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; animation: slowPan 24s ease-in-out infinite alternate; }
    @keyframes slowPan { from { transform: scale(1.05) translateX(0); } to { transform: scale(1.05) translateX(-3%); } }
    
    .hero-desc {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      font-size: 0.7rem;
      text-align: center;
      color: #f59e0b;
      z-index: 10;
      font-weight: 500;
    }  
  .hero-badge { display: inline-block; padding: 5px 12px; background: var(--accent); color: #000; font-weight: 800; font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%); margin-bottom: 10px; } 

    /* ===== Group Headers Premium ===== */
    .group-header { 
      grid-column: 1 / -1; 
      margin: 5px 0 20px; 
      padding: 0 8px; 
      position: relative; 
    }
    .group-header::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
      z-index: 0;
    }
    .group-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      padding: 10px 20px; 
      background: linear-gradient(135deg, var(--surface) 0%, rgba(245,158,11,0.15) 50%, var(--surface) 100%); 
      border: 1px solid var(--accent);
      border-left: 4px solid var(--accent);
      color: #fff; 
      font-size: 0.95rem; 
      font-weight: 800; 
      letter-spacing: 1px; 
      text-transform: uppercase;
      clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      transition: var(--ease);
    }
    .group-badge.vip-badge {
      background: linear-gradient(135deg, #1a0f0a 0%, rgba(245,158,11,0.25) 50%, #1a0f0a 100%);
      border-color: #f59e0b;
      box-shadow: 0 0 12px rgba(245,158,11,0.3);
    }

    /* ===== CARDS GRID ===== */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); 
      gap: 18px; 
      padding: 4px 0; 
      margin-top: 20px; 
    }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 24px; } }
    .card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: var(--radius); 
      overflow: hidden; 
      position: relative; 
      cursor: pointer; 
      transition: transform 0.25s var(--ease), box-shadow 0.25s; 
      text-decoration: none; 
      display: block;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); border-color: var(--accent); }
    .card-media { position: relative; aspect-ratio: 16/9.5; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .card-media img { width: 100%; height: 100%; object-fit: contain; padding: 6px; transition: transform 0.3s var(--ease); }
    .card:hover .card-media img { transform: scale(1.07); }
    .card-content { padding: 8px 14px 16px; position: relative; z-index: 2; margin-top: -12px; transform: translateY(8px); }
    .card-title { font-size: 0.85rem; font-weight: 700; line-height: 1.25; color: #fff; text-align: center; letter-spacing: 0.2px; }
    .card-meta { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.65rem; color: var(--accent); font-weight: 600; margin-top: 4px; }
    .card-live { position: absolute; top: 8px; left: 8px; background: #dc2626; color: #fff; font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; z-index: 5; }
    .card-live.vip { background: #f59e0b; color: #000; }

    /* Premium Timer */
    .premium-timer {
    position: absolute;
    top: 3px;
    left: 3px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
    font-size: 0.7rem;
    text-align: center;
    padding: 4px 8px;
    border-radius: 20px;
    color: #f00;
    font-family: monospace;
    font-weight: bold;
    z-index: 20;
    border: 1px solid rgba(245,158,11,0.4);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    letter-spacing: 1px;
    direction: ltr;
  }
    .premium-timer .extend-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* NAV-BAR */
    .nav-bar {
      position: relative;
      display: flex;
      gap: 12px;
      margin: 0 auto 32px;
      max-width: 600px;
      background: rgba(2, 4, 10, 0.65);
      backdrop-filter: blur(24px);
      border-radius: 80px;
      padding: 6px 10px;
      z-index: 100;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(245, 158, 11, 0.2);
    }
    .nav-item {
      flex: 1;
      position: relative;
      padding: 12px 4px;
      text-align: center;
      text-decoration: none;
      color: #8e9aaf;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      border-radius: 60px;
      background: transparent;
      z-index: 2;
      cursor: pointer;

    .nav-item i { font-size: 1.4rem; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2); }

    .nav-item:hover { transform: translateY(-3px); color: #ffffff; }
    .nav-item:hover i { transform: translateY(-4px) scale(1.1); color: #fbbf24; }
    .nav-item.active { background: linear-gradient(115deg, rgba(245, 158, 11, 0.12) 0%, rgba(245, 158, 11, 0.02) 100%); }
    .nav-item.active i { color: #fbbf24; transform: scale(1.08) translateY(-2px); }
    .nav-item.active span { background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* Premium Modal */
    .premium-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: all 0.25s ease;
    }
    .premium-modal.active {

      opacity: 1;
    }
    .modal-card {

      width: 280px;
      max-width: 85%;
      border-radius: 24px;
      border: 1px solid rgba(245,158,11,0.4);
      padding: 24px 20px 20px;
      text-align: center;
      position: relative;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .premium-modal.active .modal-card {
      transform: scale(1);
    }
    .modal-close {

      top: 12px;

      color: #6b7280;
      font-size: 1.4rem;

      padding: 4px 8px;

    .modal-icon { font-size: 2.5rem; margin-bottom: 8px; }

    .modal-desc { font-size: 0.75rem; color: #9ca3af; margin-bottom: 20px; }
    .watch-ad-btn {

      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .watch-ad-btn:disabled {

    }
    .close-modal-btn {

    .hidden { display: none !important; }
    .toast {

      top: 20px;
      left: 50%;

      border: 1px solid var(--accent);

    .container { max-width: 100%; padding: 0; margin: 0 auto; position: relative; z-index: 1; max-width: 480px; display: block; }
